server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # 헬스체크용 엔드포인트
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # 응답 헤더로 실행 환경 확인 (ENV → envsubst 템플릿으로 주입)
    add_header X-App-Env "${APP_ENV}" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
